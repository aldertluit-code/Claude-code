name: Prijsradar spider

on:
  schedule:
    - cron: "17 5 * * *"   # dagelijks rond 06:17 NL-tijd
  workflow_dispatch:
    inputs:
      debug_shop:
        description: "Winkel-id om te debuggen (leeg = normale run)"
        required: false
        default: ""
      test_alert:
        description: "Stuur een testmelding van de prijsalert"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Debug één winkel
        if: ${{ inputs.debug_shop }}
        env:
          SHOP: ${{ inputs.debug_shop }}
        run: python3 spider/spider.py --only "$SHOP" --dump
      - name: Prijzen ophalen
        if: ${{ !inputs.debug_shop }}
        run: python3 spider/spider.py
        continue-on-error: true
      - name: Wijzigingen committen
        if: ${{ !inputs.debug_shop }}
        run: |
          git config user.name "prijsradar-bot"
          git config user.email "prijsradar-bot@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt $(date -u +%F)"
          git push
      - name: Prijsalert
        if: ${{ !inputs.debug_shop }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 spider/alert.py ${{ inputs.test_alert && '--test' || '' }}
