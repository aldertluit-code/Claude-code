name: Prijsradar spider

on:
  schedule:
    - cron: "17 5 * * *"   # dagelijks rond 06:17 NL-tijd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prijzen ophalen
        run: python3 spider/spider.py
        continue-on-error: true
      - name: Wijzigingen committen
        run: |
          git config user.name "prijsradar-bot"
          git config user.email "prijsradar-bot@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt $(date -u +%F)"
          git push
